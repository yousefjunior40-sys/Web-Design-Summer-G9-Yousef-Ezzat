<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul>
    <li>Home</li>
    <li>Services</li>
    <li>About</li>
    <li>Contact</li>
</ul>
<script>
    let items = document.querySelectorAll("li");

    items.forEach(function(item) {

        item.onclick = function() {

            items.forEach(function(item) {
                item.style.color = "";
            });

            this.style.color = "red";
        };

    });
</script>
</body>
</html>
