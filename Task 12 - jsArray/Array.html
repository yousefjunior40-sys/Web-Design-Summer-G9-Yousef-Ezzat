<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <script>
      let courses = ["html", "css", "js"];

      let course = prompt("Enter course:");

      if (courses.includes(course)) alert(" index " + " = " + courses.indexOf(course));
      else {
        courses.push(course);
        alert(courses);
      }
    </script>
  </body>
</html>
